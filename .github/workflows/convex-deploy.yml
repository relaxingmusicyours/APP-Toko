name: Deploy Convex

# Menjalankan 'bunx convex deploy' setiap push ke main:
# kode di src/convex/ otomatis ter-deploy ke deployment Convex
# kindhearted-hyena-705 (dev), ditentukan oleh CONVEX_DEPLOY_KEY.
# Folder fungsi dibaca dari convex.json ("functions": "src/convex/"),
# jadi workflow ini aman meski folder fungsi tidak di ./convex.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: convex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Push functions to Convex
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Deploy functions to Convex
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::Secret CONVEX_DEPLOY_KEY belum diisi."
            echo "Isi di GitHub: Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          bunx convex deploy --typecheck disable
        env:
          # Tidak perlu CONVEX_DEPLOYMENT: kalau CONVEX_DEPLOY_KEY
          # terisi, Convex CLI langsung deploy ke deployment milik key itu.
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
